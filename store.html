<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>VidhyaLabs Store</title>
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
body{background:var(--bg)}
.wrap{max-width:640px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.bar img{height:32px;width:auto;display:block}
.bar .sp{flex:1}
.bar b{font-size:.95rem}
.bar .meta,.bar button{white-space:nowrap}
.bar .meta{overflow:hidden;text-overflow:ellipsis;max-width:34vw}
main{padding:16px 0 60px}
.login{padding:22px;margin-top:40px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;font-weight:700;padding:.6em;border-radius:99px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.job{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.id{font-weight:800}
.meta{color:var(--muted);font-size:.88rem}
.job ul{margin:.6rem 0;padding-left:1.2rem;font-size:1.02rem}
.job li{margin-bottom:.2rem}
.chip2{font-size:.72rem;font-weight:800;padding:.15em .65em;border-radius:99px;background:var(--sun-l);color:#6b5516}
.chip2.good{background:var(--leaf);color:var(--green-d)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.err{color:#b3261e;font-weight:600;margin:.6rem 0 0}
.hidden{display:none!important}
.banner{background:var(--sun-l);color:#6b5516;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.92rem;font-weight:600}
.prod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.prod .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:.5rem 0}
.prod label{font-size:.78rem;font-weight:700;color:var(--muted)}
.prod input[type=number],.add input,.add select{width:100%;box-sizing:border-box}
.add{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.add h3{margin:0 0 .6rem;font-size:1rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns .btn{padding:.5em 1.1em}
.lnk{background:none;border:0;color:#b3261e;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><div class="wrap"><div class="bar"><img src="images/logo-lockup.png" alt="VidhyaLabs"><b>Store</b><span class="sp"></span><a class="meta" href="index.html" style="margin-right:6px">Home</a><span class="meta" id="who"></span><button class="btn btn-ghost" id="out" type="button" style="padding:.45em 1em">Sign out</button></div></div></header>
<main class="wrap">
  <div class="card login hidden" id="login">
    <h2 style="font-size:1.3rem">Store sign in</h2>
    <p class="muted">Use the phone number you applied with and the 6-digit PIN you chose when you applied. Not a partner yet? <a href="partner.html">Apply to join</a>.</p>
    <form id="form">
      <div style="margin-bottom:.8rem"><label for="ph">Phone number</label><input id="ph" type="tel" inputmode="tel" autocomplete="username" required></div>
      <div><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" style="margin-top:1rem" type="submit">Sign in</button>
      <p class="err hidden" id="err"></p>
    </form>
  </div>
  <div id="app" class="hidden">
    <div id="banner"></div>
    <div class="tabs"><button data-f="todo" class="on">To pack <span id="n-todo"></span></button><button data-f="done">Handed over <span id="n-done"></span></button><button data-f="prod">My products <span id="n-prod"></span></button><button data-f="prof">Profile</button></div>
    <div id="list"></div>
  </div>
</main>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var C = VL.config, $ = function (i) { return document.getElementById(i); };
  var st = { phone: '', pin: '', f: 'todo', orders: [], items: [], status: '', busy: false }, timer = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(t) { var d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k) || ''; if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} return ''; }
  function api(p) {
    if (!C.formEndpoint) return Promise.resolve({ ok: false, error: 'noendpoint' });
    return fetch(C.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ type: 'store', phone: st.phone, pin: st.pin }, p)) })
      .then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: 'network' }; });
  }
  function showErr(r) {
    var e = $('err'); e.classList.remove('hidden');
    e.textContent = r.error === 'auth' ? 'Wrong phone number or PIN, or your store is not approved yet.' : r.error === 'locked' ? 'Too many wrong attempts. Try again in 15 minutes.' : r.error === 'noendpoint' ? 'The backend is not connected yet. Ask the VidhyaLabs team.' : 'Could not connect. Check your internet and try again.';
  }
  function signOut() { ss('vl_store', null); st.phone = st.pin = ''; clearInterval(timer); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('who').textContent = ''; $('pin').value = ''; }
  function load() {
    if (st.busy) return Promise.resolve(); st.busy = true;
    return api({ action: 'list' }).then(function (r) {
      st.busy = false;
      if (!r.ok) { if (r.error === 'auth' || r.error === 'locked') { signOut(); showErr(r); } return; }
      st.orders = r.orders || []; st.status = r.store && r.store.status || 'Approved'; $('who').textContent = r.store && r.store.name || '';
      if (st.status !== 'Approved') { st.items = []; render(); return; }
      return api({ action: 'items' }).then(function (ri) { if (ri.ok) st.items = ri.items || []; render(); });
    });
  }
  function isTodo(o) { return o.status === 'Placed' || o.status === 'Confirmed'; }
  function render() {
    var todo = st.orders.filter(isTodo), done = st.orders.filter(function (o) { return !isTodo(o); });
    $('n-todo').textContent = '(' + todo.length + ')'; $('n-done').textContent = '(' + done.length + ')';
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-f') === st.f); });
    $('n-prod').textContent = st.status === 'Approved' ? '(' + st.items.length + ')' : '';
    $('banner').innerHTML = st.status === 'Pending' ? '<div class="banner">Your application is under review. Our team will approve it soon. You can add products once approved, and orders start then.</div>' : '';
    if (st.f === 'prof') { if (!keepForm()) { $('list').innerHTML = profView(); fillProf(); } return; }
    if (st.f === 'prod') { if (!keepForm()) $('list').innerHTML = prodView(); return; }
    var list = st.f === 'todo' ? todo : done;
    $('list').innerHTML = list.length ? list.map(job).join('') : '<div class="empty">' + (st.f === 'todo' ? 'No orders to pack right now.' : 'Nothing handed over in the last 2 days.') + '</div>';
  }
  var CATS = ['Milk & dairy', 'Vegetables', 'Fruits', 'Groceries', 'Newspapers', 'Drinking water'];
  function profView() {
    return '<div class="add"><h3>Store details</h3><div id="pf"><p class="meta">Loading…</p></div></div>' +
      '<div class="add"><h3>Change PIN</h3><input id="np" type="password" inputmode="numeric" maxlength="6" placeholder="New 6-digit PIN" autocomplete="new-password" style="margin-bottom:8px"><input id="np2" type="password" inputmode="numeric" maxlength="6" placeholder="Confirm new PIN" autocomplete="new-password" style="margin-bottom:8px"><button class="btn btn-ghost" id="chpin" type="button">Change PIN</button><p class="meta" id="pinmsg"></p></div>';
  }
  function fillProf() {
    api({ action: 'profile' }).then(function (r) {
      st.busy = false; var box = $('pf'); if (!box) return; if (!r.ok) { box.innerHTML = '<p class="err">Could not load your details.</p>'; return; }
      var p = r.profile, areas = (C.areas || []).slice(); if (areas.indexOf(p.area) < 0) areas.unshift(p.area);
      box.innerHTML = '<label>Store name</label><input id="pn" value="' + esc(p.name) + '" style="margin-bottom:8px"><label>Owner name</label><input id="po" value="' + esc(p.owner) + '" style="margin-bottom:8px">' +
        '<label>Phone number (your login)</label><input id="pp" type="tel" inputmode="tel" value="' + esc(p.phone) + '" style="margin-bottom:8px"><label>Area</label><select id="pa" style="margin-bottom:8px">' + areas.map(function (a) { return '<option' + (a === p.area ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select>' +
        '<label>Store address</label><input id="pd" value="' + esc(p.address) + '" style="margin-bottom:8px"><label>FSSAI licence number</label><input id="pf2" value="' + esc(p.fssai) + '" style="margin-bottom:8px">' +
        '<label>What you sell</label><div class="btns" style="margin-bottom:10px">' + CATS.map(function (c) { return '<label style="display:flex;gap:6px;align-items:center;font-size:.9rem"><input type="checkbox" name="pcat" value="' + esc(c) + '"' + (p.categories.indexOf(c) > -1 ? ' checked' : '') + '> ' + esc(c) + '</label>'; }).join('') + '</div>' +
        '<button class="btn btn-primary" id="saveprof" type="button">Save details</button><p class="meta" id="profmsg"></p>';
    });
  }
  function keepForm() { var a = document.activeElement; return !!(a && $('list').contains(a) && /INPUT|SELECT/.test(a.tagName)); }
  function prodRow(i) {
    var id = esc(i.id);
    return '<div class="prod" data-p="' + id + '"><div class="row"><b>' + esc(i.name) + '</b><span class="meta">' + esc(i.variant) + '</span></div>' +
      '<div class="g"><div><label>Your price (₹)</label><input type="number" min="0" step="0.5" inputmode="decimal" data-f="price" value="' + esc(i.price) + '"></div>' +
      '<div><label>Stock</label><input type="number" min="0" step="1" inputmode="numeric" data-f="stock" value="' + esc(i.stock) + '"></div></div>' +
      '<div class="btns"><label style="display:flex;gap:6px;align-items:center;font-size:.9rem"><input type="checkbox" data-f="avail"' + (i.available ? ' checked' : '') + '> Available</label><span class="sp" style="flex:1"></span>' +
      '<button class="btn btn-primary" data-save="' + id + '">Save</button><button class="lnk" data-del="' + id + '">Remove</button></div></div>';
  }
  function prodView() {
    if (st.status !== 'Approved') return '<div class="empty">Products open up once your store is approved.</div>';
    var have = {}; st.items.forEach(function (i) { have[i.id] = 1; });
    var cat = (VL.catalog || []).filter(function (c) { return c.kind === 'goods' && !have[c.id]; });
    return '<div class="add"><h3>Add from our catalogue</h3><div class="btns"><select id="cat" style="flex:1;min-width:0"><option value="">Choose a product</option>' + cat.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name + (c.variant && c.variant.length < 30 ? ' · ' + c.variant : '')) + '</option>'; }).join('') + '</select><button class="btn btn-ghost" id="addcat" type="button">Add</button></div></div>' +
      '<div class="add"><h3>Add your own product</h3><input id="cn" placeholder="Product name" style="margin-bottom:8px"><input id="cv" placeholder="Size or pack (e.g. 1 kg)" style="margin-bottom:8px"><button class="btn btn-ghost" id="addown" type="button">Add product</button></div>' +
      (st.items.length ? st.items.map(prodRow).join('') : '<div class="empty">No products yet. Add your first one above, then set its price and stock.</div>');
  }
  function job(o) {
    return '<div class="job"><div class="row"><span><span class="id">#' + esc(o.id) + '</span> <span class="chip2 ' + (isTodo(o) ? '' : 'good') + '">' + esc(o.status) + '</span></span><span class="meta">' + when(o.at) + '</span></div>' +
      '<div class="meta">Delivery area: ' + esc(o.area) + (o.slot ? ' · ' + esc(o.slot) : '') + '</div>' +
      '<ul>' + (o.lines || []).map(function (l) { return '<li>' + esc(l.text) + '</li>'; }).join('') + '</ul>' +
      (isTodo(o) ? '<button class="btn btn-primary btn-block" data-ready="' + esc(o.id) + '">Mark ready for pickup</button>' : '') + '</div>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-f')) { st.f = b.getAttribute('data-f'); render(); }
    else if (b.id === 'saveprof') {
      var np = $('pp').value.replace(/\D/g, '').slice(-10), cats = Array.prototype.map.call(document.querySelectorAll('input[name=pcat]:checked'), function (x) { return x.value; });
      if ($('pn').value.trim().length < 2 || $('po').value.trim().length < 2 || np.length !== 10 || !$('pd').value.trim()) { $('profmsg').className = 'err'; $('profmsg').textContent = 'Please fill the store name, owner, a 10-digit phone and the address.'; return; }
      b.disabled = true;
      api({ action: 'profile_save', name: $('pn').value.trim(), owner: $('po').value.trim(), new_phone: np, area: $('pa').value, address: $('pd').value.trim(), fssai: $('pf2').value.trim(), categories: cats }).then(function (r) {
        st.busy = false; b.disabled = false;
        if (r.ok && r.phoneChanged) { signOut(); $('err').classList.remove('hidden'); $('err').textContent = 'Phone number changed. Sign in again with your new number and the same PIN.'; return; }
        $('profmsg').className = r.ok ? 'meta' : 'err'; $('profmsg').textContent = r.ok ? 'Saved ✓' : r.error === 'phone already used' ? 'That phone number is already used by another store.' : 'Could not save. Try again.'; if (r.ok) $('who').textContent = $('pn').value.trim();
      });
    }
    else if (b.id === 'chpin') {
      var n1 = $('np').value.trim(), n2 = $('np2').value.trim(), m = $('pinmsg'); m.className = 'err';
      if (!/^\d{6}$/.test(n1)) { m.textContent = 'The new PIN must be exactly 6 digits.'; return; } if (n1 !== n2) { m.textContent = 'The two PINs do not match.'; return; }
      b.disabled = true; api({ action: 'pin_change', new_pin: n1 }).then(function (r) {
        st.busy = false; b.disabled = false;
        if (r.ok) { st.pin = n1; ss('vl_store', JSON.stringify({ p: st.phone, k: st.pin })); $('np').value = $('np2').value = ''; m.className = 'meta'; m.textContent = 'PIN changed ✓'; } else m.textContent = 'Could not change the PIN. Try again.';
      });
    }
    else if (b.id === 'addcat' || b.id === 'addown') {
      var it;
      if (b.id === 'addcat') { var cid = $('cat').value, c = (VL.catalog || []).filter(function (x) { return x.id === cid; })[0]; if (!c) return; it = { id: c.id, name: c.name, variant: c.variant || '', price: c.price == null ? 0 : c.price, stock: 0, available: false }; }
      else { var nm = $('cn').value.trim(); if (nm.length < 2) return; it = { name: nm, variant: $('cv').value.trim(), price: 0, stock: 0, available: false }; }
      b.disabled = true; api({ action: 'item_save', item: it }).then(function (r) { st.busy = false; if (!r.ok) $('list').insertAdjacentHTML('afterbegin', '<p class="err">Could not add. Try again.</p>'); load(); });
    }
    else if (b.hasAttribute('data-save')) {
      var row = b.closest('.prod'), id = b.getAttribute('data-save'), cur = st.items.filter(function (x) { return x.id === id; })[0]; if (!cur) return;
      var price = Number(row.querySelector('[data-f=price]').value), stock = Number(row.querySelector('[data-f=stock]').value);
      if (!(price >= 0) || !(stock >= 0) || Math.floor(stock) !== stock) return row.insertAdjacentHTML('beforeend', '<p class="err">Enter a valid price and a whole-number stock.</p>');
      b.disabled = true; api({ action: 'item_save', item: { id: id, name: cur.name, variant: cur.variant, price: price, stock: stock, available: row.querySelector('[data-f=avail]').checked } }).then(function (r) { st.busy = false; b.disabled = false; if (!r.ok) row.insertAdjacentHTML('beforeend', '<p class="err">Could not save. Try again.</p>'); else b.textContent = 'Saved ✓'; load(); });
    }
    else if (b.hasAttribute('data-del')) { if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Tap again to remove'; return; } api({ action: 'item_delete', id: b.getAttribute('data-del') }).then(function () { st.busy = false; load(); }); }
    else if (b.hasAttribute('data-ready')) {
      b.disabled = true;
      api({ action: 'ready', id: b.getAttribute('data-ready') }).then(function (r) { st.busy = false; if (!r.ok) $('list').insertAdjacentHTML('afterbegin', '<p class="err">Could not update. Try again.</p>'); load(); });
    }
  });
  $('out').addEventListener('click', signOut);
  $('form').addEventListener('submit', function (e) {
    e.preventDefault(); st.phone = $('ph').value.replace(/\D/g, '').slice(-10); st.pin = $('pin').value.trim(); $('err').classList.add('hidden');
    api({ action: 'list' }).then(function (r) { if (r.ok) { ss('vl_store', JSON.stringify({ p: st.phone, k: st.pin })); start(); } else showErr(r); });
  });
  function start() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); load(); clearInterval(timer); timer = setInterval(load, 20000); }
  var saved = ss('vl_store'); if (saved) { try { var j = JSON.parse(saved); st.phone = j.p; st.pin = j.k; start(); } catch (x) { $('login').classList.remove('hidden'); } } else $('login').classList.remove('hidden');
})();
</script>
</body>
</html>
